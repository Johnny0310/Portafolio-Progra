# This workflow will build and push a .NET Core app to an Azure Web App when a commit is pushed to your default branch.
#
# This workflow assumes you have already created the target Azure App Service web app.
# For instructions see https://docs.microsoft.com/en-us/azure/app-service/quickstart-dotnetcore?tabs=net60&pivots=development-environment-vscode
#
# To configure this workflow:
#
# 1. Download the Publish Profile for your Azure Web App. You can download this file from the Overview page of your Web App in the Azure Portal.
#    For more information: https://docs.microsoft.com/en-us/azure/app-service/deploy-github-actions?tabs=applevel#generate-deployment-credentials
#
# 2. Create a secret in your repository named AZURE_WEBAPP_PUBLISH_PROFILE, paste the publish profile contents as the value of the secret.
#    For instructions on obtaining the publish profile see: https://docs.microsoft.com/azure/app-service/deploy-github-actions#configure-the-github-secret
#
# 3. Change the value for the AZURE_WEBAPP_NAME. Optionally, change the AZURE_WEBAPP_PACKAGE_PATH and DOTNET_VERSION environment variables below.
#
# For more information on GitHub Actions for Azure: https://github.com/Azure/Actions
# For more information on the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# For more samples to get started with GitHub Action workflows to deploy to Azure: https://github.com/Azure/actions-workflow-samples

name: Deploy .NET API to Azure

env:

  # Azure App Service Name
  AZURE_WEBAPP_NAME: CondoAd-API

  # Path to the API project
  # Example:
  # './MyProject.API/API'
  AZURE_WEBAPP_PACKAGE_PATH: './App/AdminCondo.API/API'

  # .NET SDK Version
  DOTNET_VERSION: '8.0'

on:
  push:
    branches: [ "main" ]

    paths-ignore:

      # Ignore database folder changes
      # Change this path if your database folder changes
      - 'App/AdminCondo.API/BD/**'

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Change project folder if root folder changes
      # Example:
      # cd "MyProject.API"

      - name: Restore dependencies
        run: |
          cd "App/AdminCondo.API"

          dotnet restore "Abstracciones/Abstracciones.csproj"
          dotnet restore "DA/DA.csproj"
          dotnet restore "Flujo/Flujo.csproj"
          dotnet restore "Reglas/Reglas.csproj"
          dotnet restore "Servicios/Servicios.csproj"
          dotnet restore "API/API.csproj"

      # Change project paths if architecture changes
      # Example:
      # "Services/Services.csproj"

      - name: Build with dotnet
        run: |
          cd "App/AdminCondo.API"
          
          dotnet build "Abstracciones/Abstracciones.csproj" --configuration Release --no-restore
          dotnet build "DA/DA.csproj" --configuration Release --no-restore
          dotnet build "Flujo/Flujo.csproj" --configuration Release --no-restore
          dotnet build "Reglas/Reglas.csproj" --configuration Release --no-restore
          dotnet build "Servicios/Servicios.csproj" --configuration Release --no-restore
          dotnet build "API/API.csproj" --configuration Release --no-restore.csproj"
          dotnet restore "API/API.csproj"

      # Optional test execution
      # Change path if test project changes
      # Example:
      # "MyProject.API/Tests/Tests.csproj"
      - name: Run tests
        run: |
          cd "App/AdminCondo.API"
          dotnet test "API/API.csproj" --no-restore --verbosity normal --configuration Release || echo "No tests found or test execution failed"

      # Change API project path if needed
      # Example:
      # "MyProject.API/API/API.csproj"
      - name: Publish API
        run: |
          dotnet publish "App/AdminCondo.API/API/API.csproj" -c Release -o ./publish --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish

  deploy:

    permissions:
      contents: none

    runs-on: ubuntu-latest

    needs: build

    environment:

      # Environment Name
      # Example:
      # Production-API
      name: '!-- ENVIRONMENT_NAME --!'

      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:

          # Azure App Service Name
          app-name: ${{ env.AZURE_WEBAPP_NAME }}

          # GitHub Secret Name
          # Example:
          # AZURE_API_PUBLISH_PROFILE
          publish-profile: ${{ secrets.!-- YOUR_SECRET_NAME --! }}

          package: .

          respect-funcignore: true