<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container d-flex justify-content-center align-items-center vh-100">

        <div class="calculator card shadow p-4">

            <h2 class="text-center mb-4">Scientific Calculator</h2>

            <input
                type="text"
                id="display"
                class="form-control form-control-lg text-end mb-3"
                readonly>

            <div class="row g-2">

                <div class="col-3">
                    <button class="btn btn-danger w-100" onclick="clearAll()">AC</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-warning w-100" onclick="clearLast()">C</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-secondary w-100" onclick="appendValue('(')">(</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-secondary w-100" onclick="appendValue(')')">)</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-light w-100" onclick="appendValue('7')">7</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-light w-100" onclick="appendValue('8')">8</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-light w-100" onclick="appendValue('9')">9</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-primary w-100" onclick="appendValue('/')">/</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-light w-100" onclick="appendValue('4')">4</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-light w-100" onclick="appendValue('5')">5</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-light w-100" onclick="appendValue('6')">6</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-primary w-100" onclick="appendValue('*')">*</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-light w-100" onclick="appendValue('1')">1</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-light w-100" onclick="appendValue('2')">2</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-light w-100" onclick="appendValue('3')">3</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-primary w-100" onclick="appendValue('-')">-</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-light w-100" onclick="appendValue('0')">0</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-light w-100" onclick="appendValue('.')">.</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-success w-100" onclick="calculate()">=</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-primary w-100" onclick="appendValue('+')">+</button>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
